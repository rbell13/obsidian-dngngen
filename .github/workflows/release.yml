name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const manifestVersion = JSON.parse(readFileSync("manifest.json", "utf8")).version;

          if (packageVersion !== releaseVersion || manifestVersion !== releaseVersion) {
            throw new Error(`Tag ${releaseVersion}, package ${packageVersion}, and manifest ${manifestVersion} must match.`);
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run checks and build
        run: npm run check

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="DNGNGEN Renderer $GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json
